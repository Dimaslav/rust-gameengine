[package]
name = "fallen-citadel"
version = "0.1.0"
edition = "2024"

[features]
default = ["editor"]
editor = ["rust-engine/editor"]

[dependencies]
# Движок. Runtime — по умолчанию, editor — через feature выше.
rust-engine = { path = "../../", default-features = false }

# Зависимости, которые нужны самой игре
glam = "0.34.2"
winit = "0.30.13"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.2"
log = "0.4"