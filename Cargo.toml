[package]
name = "rust-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.29"
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
glam = { version = "0.27", features = ["bytemuck", "serde"] }
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
anyhow = "1"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

egui = "0.28"
egui-wgpu = "0.28"
egui-winit = "0.28"