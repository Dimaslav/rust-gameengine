[workspace]
# Теперь у нас есть движок (корень ".") и игра-пример (samples/fallen-citadel)
members = [".", "samples/fallen-citadel"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
license = "Proprietary"
repository = "https://github.com/Dimaslav/rust-gameengine"
authors = ["Dimaslav"]

[package]
name = "rust-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust Engine 3D — modular game engine (editor + runtime)"
default-run = "engine-editor"

[lib]
name = "rust_engine"
path = "src/lib.rs"

# Редактор движка (пока пустой, запускает пустую сцену)
[[bin]]
name = "engine-editor"
path = "src/bin/engine-editor.rs"

[[bin]]
name = "engine-cli"
path = "src/bin/engine-cli.rs"

# Упаковщик ассетов
[[bin]]
name = "packer"
path = "src/bin/packer.rs"

# Бинарник rust-engine (src/main.rs) мы УДАЛИЛИ, 
# так как игра теперь запускается из samples/fallen-citadel.

[dependencies]
# --- Window / scripting ---
winit = "0.30.13"
rhai = "1.27.0"

# --- Graphics ---
wgpu = "30.0.1"

# --- Async bootstrap ---
pollster = "1.0.1"

# --- Serialization / math / utils ---
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.2", features = ["bytemuck", "serde"] }
log = "0.4.34"
env_logger = "0.11.11"

# --- Images / HDR / EXR ---
image = { version = "0.25.10", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "tga", "dds",
    "hdr", "exr", "ico", "pnm", "qoi", "ff",
    "avif",
    "rayon",
] }

# --- zlib для FBX binary ---
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# --- Errors / glTF / serde / ron ---
anyhow = "1.0.104"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
ron = "0.12.2"
base64 = "0.22"

# --- UI (editor) ---
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image", "svg"] }

# --- Audio ---
rodio = "0.21"

# --- Native file dialog ---
rfd = "0.17.2"

# --- windows version pin for wgpu-hal / gpu-allocator ---
windows = "0.62.2"

[profile.dev]
opt-level = 0
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16