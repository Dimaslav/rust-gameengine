[workspace]
# Q2: `crates/engine-cli` и `samples/*` будут добавлены как отдельные
# крейты (project wizard, примеры). Пока — single-package workspace.
members = ["."]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
license = "Proprietary"
repository = "https://github.com/Dimaslav/rust-gameengine"
authors = ["Dimaslav"]

[package]
name = "rust-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust Engine 3D — modular game engine (editor + runtime)"
default-run = "engine-editor"

[lib]
name = "rust_engine"
path = "src/lib.rs"

[[bin]]
name = "engine-editor"
path = "src/bin/engine-editor.rs"

[[bin]]
name = "rust-engine"
path = "src/main.rs"

[[bin]]
name = "packer"
path = "src/bin/packer.rs"

[dependencies]
# --- Window / scripting ---
winit = "0.30.13"
rhai = "1.27.0"

# --- Graphics ---
wgpu = "30.0.1"

# --- Async bootstrap ---
pollster = "1.0.1"

# --- Serialization / math / utils ---
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.2", features = ["bytemuck", "serde"] }
log = "0.4.34"
env_logger = "0.11.11"

# --- Images / HDR / EXR ---
image = { version = "0.25.10", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "tga", "dds",
    "hdr", "exr", "ico", "pnm", "qoi", "ff",
    "avif",
    "rayon",
] }

# --- zlib для FBX binary ---
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# --- Errors / glTF / serde / ron ---
anyhow = "1.0.104"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
ron = "0.12.2"

# --- base64 (заменяет самописный код в scene/serialize.rs) ---
base64 = "0.22"

# --- UI (editor) ---
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"

# --- Editor thumbnails ---
egui_extras = { version = "0.37.0", features = ["image", "svg"] }

# --- Audio ---
rodio = "0.21"

# --- Native file dialog ---
rfd = "0.17.2"

# --- windows version pin for wgpu-hal / gpu-allocator ---
windows = "0.62.2"

# ============================================================
# Profiles
# ============================================================
#
# FIX (render=41-49 ms в Play, fps=20):
#   * `dev` — opt-level=1 для своего кода (быстрая сборка,
#     ~2× ускорение math/graphics), зависимости с opt-level=3
#     (wgpu/glam/winit без оптимизаций тормозят в 10-20×).
#   * `release` — LTO + codegen-units=1 + strip, ~5-8× ускорение
#     render по сравнению с dev.
#
# Ожидаемый эффект: fps 20 → 60 (vsync).

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.dev.package."*"]
# Зависимости (wgpu, glam, winit, rodio) с оптимизацией — иначе
# рендер тормозит в 10-20×, а матрицы/шум/физика в dev-профиле
# просто не успевают за vsync.
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic="abort" отключён, чтобы crash.rs::install_crash_handler
# ловил панику с полным backtrace. Если нужен минимальный
# бинарь — раскомментируй (backtrace в crash.log будет короче).
# panic = "abort"
strip = true