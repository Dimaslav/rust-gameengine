[workspace]
members = [".", "samples/fallen-citadel"]
default-members = ["."]
exclude = ["projects", "templates"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
license = "Proprietary"
repository = "https://github.com/Dimaslav/rust-gameengine"
authors = ["Dimaslav"]

[package]
name = "rust-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust Engine 3D — modular game engine (editor + runtime)"
default-run = "engine-editor"

[lib]
name = "rust_engine"
path = "src/lib.rs"

# ---------------------------------------------------------------------------
# Feature flags: runtime (default для движка) vs editor.
# `editor` включает egui-стек, rfd и hot-reload.
# Shipping-билд игр пользователя собирается с --no-default-features.
# ---------------------------------------------------------------------------
[features]
default = ["editor"]
editor = [
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:egui_extras",
    "dep:rfd",
    "hot-reload",
]
hot-reload = []

# Редактор: требует `editor`.
[[bin]]
name = "engine-editor"
path = "src/bin/engine-editor.rs"
required-features = ["editor"]

# CLI и packer — без редактора.
[[bin]]
name = "engine-cli"
path = "src/bin/engine-cli.rs"

[[bin]]
name = "packer"
path = "src/bin/packer.rs"

[dependencies]
# --- Window / scripting ---
winit = "0.30.13"
rhai = "1.27.0"
fontdue = "0.9"

# --- Graphics ---
wgpu = "30.0.1"

# --- Async bootstrap ---
pollster = "1.0.1"

# --- Serialization / math / utils ---
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.2", features = ["bytemuck", "serde"] }
log = "0.4.34"
env_logger = "0.11.11"

# --- Images / HDR / EXR ---
image = { version = "0.25.10", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff", "tga", "dds",
    "hdr", "exr", "ico", "pnm", "qoi", "ff",
    "avif",
    "rayon",
] }

# --- zlib для FBX binary ---
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# --- Errors / glTF / serde / ron ---
anyhow = "1.0.104"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
ron = "0.12.2"
base64 = "0.23.1"

# --- Audio ---
rodio = "0.23.0"

# --- windows version pin for wgpu-hal / gpu-allocator ---
windows = "0.62.2"

# --- Editor (ВСЁ optional) ---
egui        = { version = "0.37.0", features = ["default_fonts"], optional = true }
egui-wgpu   = { version = "0.37.0", optional = true }
egui-winit  = { version = "0.37.0", optional = true }
egui_extras = { version = "0.37.0", features = ["image", "svg"], optional = true }
rfd         = { version = "0.18.0", optional = true }

[profile.dev]
opt-level = 0
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = "s"
debug-assertions = false

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true

[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"