name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxinerama-dev libvulkan-dev pkg-config

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Rustfmt check
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      # ---------------------------------------------------------------
      # 1. Runtime-only: editor-зависимости НЕ должны попасть в граф.
      #    Это главный P0-гейт.
      # ---------------------------------------------------------------
      - name: Cargo check (runtime, no editor)
        run: cargo check --workspace --no-default-features --all-targets

      - name: Verify runtime dependency tree is clean
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -o pipefail
          if cargo tree --no-default-features --bin engine-cli | grep -E '\b(egui|egui-wgpu|egui-winit|egui_extras|rfd)\b'; then
            echo "❌ Editor crates leaked into runtime dependency tree"
            exit 1
          fi
          echo "✓ Runtime tree clean"

      # ---------------------------------------------------------------
      # 2. Editor build (на Windows — обязательный, на остальных — canary).
      # ---------------------------------------------------------------
      - name: Cargo check (editor)
        if: matrix.os == 'windows-latest'
        run: cargo check --workspace --features editor --all-targets

      - name: Cargo check (editor, canary)
        if: matrix.os != 'windows-latest'
        continue-on-error: true
        run: cargo check --workspace --features editor --all-targets

      - name: Clippy (workspace, editor)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --workspace --features editor --all-targets -- -W clippy::all

      - name: Cargo test (workspace)
        if: matrix.os == 'windows-latest'
        run: cargo test --workspace

  projects_smoke_test:
    name: Projects smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-smoke

      - name: Build engine-cli (runtime)
        run: cargo build --bin engine-cli --no-default-features

      - name: Create sample project
        run: cargo run --bin engine-cli --no-default-features -- new ci_smoke_test

      - name: Verify project structure
        shell: bash
        run: |
          test -f projects/ci_smoke_test/project.ron
          test -f projects/ci_smoke_test/scene.ron
          test -f projects/ci_smoke_test/Cargo.toml
          test -f projects/ci_smoke_test/src/main.rs
          test -d projects/ci_smoke_test/assets
          test -d projects/ci_smoke_test/assets/items
          echo "✓ Project structure OK"

      - name: Build new project (runtime)
        working-directory: projects/ci_smoke_test
        run: cargo build

      - name: List projects
        run: cargo run --bin engine-cli --no-default-features -- list